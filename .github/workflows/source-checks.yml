name: Validate source syntax

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m compileall -q app sandbox tests
      - name: Install lightweight search-test dependencies
        run: python -m pip install httpx==0.28.1 pydantic-settings==2.7.1 python-dotenv==1.0.1 sqlalchemy==2.0.36 aiosqlite==0.20.0
      - name: Test web search parsing and provider fallbacks
        run: python -m unittest discover -s tests -p 'test_websearch.py' -v
      - name: Test TTS text cleanup and API request
        run: python -m unittest discover -s tests -p 'test_tts.py' -v
      - name: Test rolling audio generation quota
        run: python -m unittest discover -s tests -p 'test_audio_quota.py' -v
      - name: Test parallel audio generation guard
        run: python -m unittest discover -s tests -p 'test_audio_state.py' -v
      - name: Test isolated sandbox execution and authentication
        run: sudo python -m unittest discover -s tests -p 'test_sandbox_runner.py' -v
      - name: Check browser JavaScript syntax
        run: node --check frontend/js/app.js
      - name: Check static HTML IDs and cache references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class IdCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.ids.extend(value for key, value in attrs if key == "id")

          html = Path("frontend/index.html").read_text(encoding="utf-8")
          parser = IdCheck()
          parser.feed(html)
          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if "/assets/css/app.css?v=42" not in html:
              raise SystemExit("Unexpected CSS cache reference")
          if "/assets/js/app.js?v=51" not in html:
              raise SystemExit("Unexpected JS cache reference")
          print("HTML IDs are unique; static asset references are current.")

          css = Path("frontend/css/app.css").read_text(encoding="utf-8")
          def css_rule_contains(selector, snippet):
              start = css.find(selector)
              end = css.find("}", start) if start >= 0 else -1
              return start >= 0 and end >= 0 and snippet in css[start:end]
          if not css_rule_contains(".msg .meta button {", "background: var(--bg);"):
              raise SystemExit("Message action buttons must match the page background")
          if ".msg .meta button { background: var(--bg); }" not in css:
              raise SystemExit("Dark theme action buttons must match the dark page background")
          if not css_rule_contains(".src-row {", "background: var(--bg);"):
              raise SystemExit("Source cards must match the page background")
          if "stroke='%23b8862f'" in css:
              raise SystemExit("Orange dropdown-arrow accent should stay neutral gray")

          js = Path("frontend/js/app.js").read_text(encoding="utf-8")
          # A single-element $() selector may return null; only $() is iterable.
          bad_for_each = [
              f"{line_no}: {line.strip()}"
              for line_no, line in enumerate(js.splitlines(), 1)
              if re.search(r"(?<!\$)\$\([^)]*\)\s*\.forEach\s*\(", line)
          ]
          if bad_for_each:
              raise SystemExit("Single-element selector used with forEach:\n" + "\n".join(bad_for_each))
          router = Path("app/ai/router.py").read_text(encoding="utf-8")
          messages = Path("app/routers/messages.py").read_text(encoding="utf-8")
          required_js = [
              "$$('[data-audio-control]').find",
              "$$('[data-audio-close]')",
              "$$('[data-audio-action]')",
              'data-mact="copy-user"',
              'data-mact="generate-audio"',
              'data-mact="play-audio"',
              'function startAudioStatusPolling()',
              'navigator.mediaSession.setActionHandler',
              "if (!Array.isArray(nodes) || id == null) return null;",
              "const rawIndex = selected[parentKey];",
              "typeof node.id === 'string' && node.id",
              "function startDeviceSpeech(messageId)",
              "function bindDeviceSpeechPlayer()",
              "function openDeviceCodeRunner(item)",
              "function shouldAskExecutionTarget(text)",
              "execution_target: selectedExecutionTarget",
              'data-run-device="',
              "const DEVICE_PYTHON_RUNNER_TEMPLATE",
              "py.loadPackagesFromImports(source)",
              "micropip.install(packageName)",
              "function resumeDeviceSpeech()",
              "speakDeviceChunk(0, true)",
              "pending: false",
              "python-docx",
              "svgwrite",
              "tabulate",
              "qrcode",
              "docx2txt",
              "python-barcode",
              "pyodideAliases",
              "deviceSpeechState.priming = false",
              "device-code-file-preview",
          ]
          missing = [token for token in required_js if token not in js]
          if missing:
              raise SystemExit("Missing message/audio interaction hooks: " + ", ".join(missing))
          if 'id="i-gift-open"' not in html or 'class="auth-audio-promo"' not in html:
              raise SystemExit("Login free-audio promo or open-gift icon is missing")
          if 'active_audio_generation(user.id)' not in messages or 'generating_message_id' not in messages:
              raise SystemExit("Server audio status must expose cross-device generation state")
          if 'def begin_audio_generation' not in Path("app/services/audio_state.py").read_text(encoding="utf-8"):
              raise SystemExit("Missing per-user audio generation guard")
          if 'data-sugg="' in js:
              raise SystemExit("Post-answer follow-up suggestion buttons must stay removed")
          if any(token in router for token in ("_run_suggestions", "_parse_suggestions")):
              raise SystemExit("Post-answer suggestion generation must stay disabled")
          if 'async def create_message_audio' not in messages or 'async def get_message_audio' not in messages:
              raise SystemExit("Missing authenticated audio endpoints")
          print("Audio player hooks and message copy actions are present; follow-up suggestions are disabled.")
          PY
