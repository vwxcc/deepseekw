name: Validate source syntax

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m compileall -q app sandbox tests
      - name: Install lightweight search-test dependencies
        run: python -m pip install httpx==0.28.1 pydantic-settings==2.7.1 python-dotenv==1.0.1 sqlalchemy==2.0.36 aiosqlite==0.20.0
      - name: Test primary provider environment overrides
        run: python -m unittest discover -s tests -p 'test_primary_provider_config.py' -v
      - name: Test permanent provider model errors
        run: python -m unittest discover -s tests -p 'test_provider_model_errors.py' -v
      - name: Test streaming activity marker parsing
        run: python -m unittest discover -s tests -p 'test_activity_stream.py' -v
      - name: Test AI follow-up questions and options
        run: python -m unittest discover -s tests -p 'test_ask_options.py' -v
      - name: Test bundled AI-Ch skills
        run: python -m unittest discover -s tests -p 'test_skills.py' -v
      - name: Test web search parsing and provider fallbacks
        run: python -m unittest discover -s tests -p 'test_websearch.py' -v
      - name: Test TTS text cleanup and API request
        run: python -m unittest discover -s tests -p 'test_tts.py' -v
      - name: Test rolling audio generation quota
        run: python -m unittest discover -s tests -p 'test_audio_quota.py' -v
      - name: Test parallel audio generation guard
        run: python -m unittest discover -s tests -p 'test_audio_state.py' -v
      - name: Test isolated sandbox execution and authentication
        run: sudo python -m unittest discover -s tests -p 'test_sandbox_runner.py' -v
      - name: Check browser JavaScript syntax
        run: node --check frontend/js/app.js
      - name: Test subscription modal comparison rendering
        run: |
          node <<'JS'
          const fs = require('fs');
          const source = fs.readFileSync('frontend/js/app.js', 'utf8');
          const start = source.indexOf('function planCompareHtml(lim, compare) {');
          const end = source.indexOf('let subscriptionModalOpening = false;', start);
          if (start < 0 || end < 0) throw new Error('Subscription comparison renderer was not found.');
          const render = new Function(
            'escapeHtml',
            'limitValueLabel',
            source.slice(start, end) + ' return planCompareHtml;'
          )(
            value => String(value ?? ''),
            (key, value) => value == null ? '∞' : String(value)
          );
          const html = render(
            { budget_usd: 1, window_hours: 5, price: 0 },
            { pro: { budget_usd: 15, window_hours: 5, price: 19 } }
          );
          const tableCount = (html.match(/<table class="cmp">/g) || []).length;
          if (tableCount !== 2 || !html.includes('Бюджет на окно') || !html.includes('15')) {
            throw new Error('Subscription comparison renderer returned incomplete markup.');
          }
          console.log('Subscription comparison renders both columns without runtime errors.');
          JS
      - name: Parse the embedded device Python runtime
        run: |
          node <<'JS'
          const fs = require('fs');
          const source = fs.readFileSync('frontend/js/app.js', 'utf8');
          const marker = 'const DEVICE_PYTHON_RUNNER_TEMPLATE = ';
          const begin = source.indexOf(marker);
          const equals = source.indexOf('=', begin);
          const end = source.indexOf(';\n', equals);
          if (begin < 0 || equals < 0 || end < 0) throw new Error('Embedded Python runner was not found.');
          const runner = (new Function('return (' + source.slice(equals + 1, end).trim() + ')'))();
          new Function('loadPyodide', runner);
          const helperStart = source.indexOf('function deviceCodeForFilePlan(planSource) {');
          const helperEnd = source.indexOf('\n  function activityHtml(n, generating)', helperStart);
          if (helperStart < 0 || helperEnd < 0) throw new Error('Local file-plan fallback helper was not found.');
          const makeFallback = new Function(source.slice(helperStart, helperEnd) + '\nreturn deviceCodeForFilePlan;')();
          const samplePlan = JSON.stringify({format:'pptx',template_id:'presentation.education',title:'Syntax check',blocks:[{kind:'bullets',items:['First','Second']}]});
          const fallbackCode = makeFallback(samplePlan);
          const { spawnSync } = require('child_process');
          const parsedPython = spawnSync('python3', ['-c', 'import ast,sys; ast.parse(sys.stdin.read())'], {input:fallbackCode,encoding:'utf8'});
          if (parsedPython.status !== 0) throw new Error('Local file-plan fallback emitted invalid Python: ' + parsedPython.stderr);
          console.log('Embedded Python runtime and local file-plan Python syntax are valid.');
          JS
      - name: Test template-based file generation
        run: |
          python -m pip install matplotlib==3.9.4 python-docx==1.1.2 openpyxl==3.1.5 python-pptx==1.0.2 Pillow==11.0.0 pypdf==5.1.0
          python -m unittest discover -s tests -p 'test_file_templates.py' -v
          python -m unittest discover -s tests -p 'test_design_theme.py' -v
      - name: Check static HTML IDs and cache references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class IdCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  self.ids.extend(value for key, value in attrs if key == "id")

          html = Path("frontend/index.html").read_text(encoding="utf-8")
          parser = IdCheck()
          parser.feed(html)
          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if not re.search(r"/assets/css/app\.css\?v=\d+", html):
              raise SystemExit("Missing CSS asset cache version")
          if not re.search(r"/assets/js/app\.js\?v=\d+", html):
              raise SystemExit("Missing JavaScript asset cache version")
          print("HTML IDs are unique; static asset references are current.")

          css = Path("frontend/css/app.css").read_text(encoding="utf-8")
          def css_rule_contains(selector, snippet):
              start = css.find(selector)
              end = css.find("}", start) if start >= 0 else -1
              return start >= 0 and end >= 0 and snippet in css[start:end]
          if not css_rule_contains(".msg .meta button {", "background: var(--bg);"):
              raise SystemExit("Message action buttons must match the page background")
          if ".msg .meta button { background: var(--bg); }" not in css:
              raise SystemExit("Dark theme action buttons must match the dark page background")
          if ".msg.no-msg-entrance { animation: none !important; }" not in css:
              raise SystemExit("In-place message updates must not replay the entrance animation")
          if "transform: translateY(-2px)" not in css or "align-self: center;" not in css:
              raise SystemExit("Composer input and buttons must be vertically centred and lifted slightly")
          if not css_rule_contains(".src-row {", "background: var(--bg);"):
              raise SystemExit("Source cards must match the page background")
          if "stroke='%23b8862f'" in css:
              raise SystemExit("Orange dropdown-arrow accent should stay neutral gray")

          js = Path("frontend/js/app.js").read_text(encoding="utf-8")
          if "sub-keep-chatting-art" not in js or "Продолжай работу над идеей" not in js:
              raise SystemExit("The original Keep chatting-style limits illustration is missing")
          if ".sub-keep-chatting-art {" not in css:
              raise SystemExit("The limits illustration has no responsive styling")
          if "@font-face { font-family: 'PT Serif'" not in css:
              raise SystemExit("Local PT Serif font-face is missing")
          for font in ("ys-regular.woff2", "lora-cyrillic-600.woff2", "pt-400.woff2"):
              if not Path("frontend/fonts", font).is_file():
                  raise SystemExit("Missing local font asset: " + font)
          if not all(f'href="/assets/fonts/{font}"' in html for font in (
              "ys-regular.woff2", "lora-cyrillic-600.woff2", "pt-400.woff2"
          )):
              raise SystemExit("Local font preload links are incomplete")
          # A single-element $() selector may return null; only $() is iterable.
          bad_for_each = [
              f"{line_no}: {line.strip()}"
              for line_no, line in enumerate(js.splitlines(), 1)
              if re.search(r"(?<!\$)\$\([^)]*\)\s*\.(?:forEach|find|map|filter|some|reduce)\s*\(", line)
          ]
          if bad_for_each:
              raise SystemExit("Single-element selector used with a collection method:\n" + "\n".join(bad_for_each))
          router = Path("app/ai/router.py").read_text(encoding="utf-8")
          messages = Path("app/routers/messages.py").read_text(encoding="utf-8")
          required_js = [
              "$$('[data-audio-control]').find",
              "$$('[data-audio-close]')",
              "$$('[data-audio-action]')",
              'data-mact="copy-user"',
              'data-mact="generate-audio"',
              'data-mact="play-audio"',
              'function startAudioStatusPolling()',
              'navigator.mediaSession.setActionHandler',
              "if (!Array.isArray(nodes) || id == null) return null;",
              "const rawIndex = selected[parentKey];",
              "typeof node.id === 'string' && node.id",
              "function generateReadableText(messageId, force)",
              "function hydrateReadableTextStatuses(entries)",
              "function audioQuotaSnapshot()",
              "function startDeviceSpeech(messageId)",
              "function bindDeviceSpeechPlayer()",
              "function openDeviceCodeRunner(item, messageId, options)",
              "function activityStartTime(n)",
              "$$('[data-activity-elapsed]').find",
              "function activityHtml(n, generating)",
              "function openActivityStream(id)",
              "function languageLabel(lang)",
              "data-code-toggle=",
              "data-activity-full=",
              "ev === 'ui_status'",
              "ev === 'ui_action'",
              "window.__aichActivityWindows",
              "function shouldAskExecutionTarget(text)",
              "execution_target: selectedExecutionTarget",
              'data-run-device="',
              "const DEVICE_PYTHON_RUNNER_TEMPLATE",
              "py.loadPackagesFromImports(source)",
              "micropip.install(packageName)",
              "function resumeDeviceSpeech()",
              "speakDeviceChunk(0, true)",
              "pending: false",
              "python-docx",
              "svgwrite",
              "tabulate",
              "qrcode",
              "docx2txt",
              "python-barcode",
              "nativePackages",
              "function sourceImports()",
              "const nativeFailed = new Set()",
              "sys.stdlib_module_names",
              "imports.includes",
              "for (const name of imports)",
              "deviceSpeechState.priming = false",
              "device-code-file-preview",
              "function deviceCodeForFilePlan(planSource)",
              "function deviceFallbackHtml(n, runs)",
              "backgroundDeviceRunners = new Map()",
              "device-code-complete",
              "function sourceImports()",
              "const nativeFailed = new Set()",
          ]
          missing = [token for token in required_js if token not in js]
          if missing:
              raise SystemExit("Missing message/audio interaction hooks: " + ", ".join(missing))
          if 'id="i-gift-open"' not in html or 'class="auth-audio-promo"' not in html:
              raise SystemExit("Login free-audio promo or open-gift icon is missing")
          if 'active_audio_generation(user.id)' not in messages or 'generating_message_id' not in messages:
              raise SystemExit("Server audio status must expose cross-device generation state")
          if 'def begin_audio_generation' not in Path("app/services/audio_state.py").read_text(encoding="utf-8"):
              raise SystemExit("Missing per-user audio generation guard")
          if 'data-sugg="' in js:
              raise SystemExit("Post-answer follow-up suggestion buttons must stay removed")
          activity = Path("app/ai/activity_stream.py").read_text(encoding="utf-8")
          prompts = Path("app/ai/prompts.py").read_text(encoding="utf-8")
          if "ActivityMarkupParser" not in activity or "ACTIVITY_STREAM_SKILL" not in prompts:
              raise SystemExit("Streaming activity markers are not connected to the model prompt")
          lifecycle = Path("app/ai/stream_lifecycle.py").read_text(encoding="utf-8")
          if "drain_output_until_terminal" not in lifecycle or "detach_output_drain" not in messages:
              raise SystemExit("Detached SSE clients must drain events while the main generation finishes")
          if any(token in router for token in ("_run_suggestions", "_parse_suggestions")):
              raise SystemExit("Post-answer suggestion generation must stay disabled")
          if 'async def create_message_audio' not in messages or 'async def get_message_audio' not in messages:
              raise SystemExit("Missing authenticated audio endpoints")
          if 'async def create_message_readable_text' not in messages or 'async def readable_text_status' not in messages:
              raise SystemExit("Missing authenticated readable-text endpoints")
          if 'generate_speech(source, prepared=True)' not in messages or 'async def prepare_spoken_text' not in Path("app/services/tts.py").read_text(encoding="utf-8"):
              raise SystemExit("AI audio must reuse the cached readable text")
          print("Audio player hooks and message copy actions are present; follow-up suggestions are disabled.")

          if ("max_steps = 1" not in router
              or "round_limit = 1 if code_mode else 2" not in router
              or "entry_attempt_limit = 1 if code_mode else len(entries)" not in router):
              raise SystemExit("Code Agent must make only one model generation per user message")
          if "QWEN_MODEL_ID" not in Path("app/ai/provider_config.py").read_text(encoding="utf-8"):
              raise SystemExit("Explicit primary model ID override is missing")
          if 'qwen_model_id: str = ""' not in Path("app/config.py").read_text(encoding="utf-8"):
              raise SystemExit("Missing QWEN_MODEL_ID setting")
          if ("toolRunsHtml(runs)" not in js
              or "activity-execution" not in js
              or "Шаг ' + (i + 1)" in js):
              raise SystemExit("Execution output must stay inside the expandable status panel without visible step numbering")
          if "job.first_exchange and code_mode" not in router or "_local_code_chat_title(job.user_text)" not in router:
              raise SystemExit("Code Agent title must not require an extra model request")
          if 'use_model_queries=job.mode != "code"' not in router:
              raise SystemExit("Code Agent web search must not consume a separate query-planning model turn")
          if ("одним блоком run" not in Path("app/ai/prompts.py").read_text(encoding="utf-8")
              or "ровно одна генерация модели" not in Path("app/ai/prompts.py").read_text(encoding="utf-8")):
              raise SystemExit("Code Agent prompt must consolidate code work into one model generation")
          for token in (
              "function upsertChat(chat)", "function renderMessageInPlace",
              "function setChatCreationPending", "if (needsAnswerBody && state.currentChatId === streamContext.chatId)",
              "requestToken !== state.chatOpenToken",
          ):
              if token not in js:
                  raise SystemExit("Missing anti-flicker/chat-creation guard: " + token)
          PY
