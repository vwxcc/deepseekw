name: Validate ai-ch

on:
  push:
    branches:
      - render-ai-ch
      - fix/admin-quotas-model-fallbacks
  pull_request:
    branches:
      - main
      - render-ai-ch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app
      - name: Verify application imports
        env:
          DATA_DIR: /tmp/ai-ch-ci-data
          UPLOAD_DIR: /tmp/ai-ch-ci-uploads
          ADMIN_EMAIL: ci-admin@ai-ch.local
          ADMIN_PASSWORD: ci-only-test-password
        run: python -c "from app.ai import prompts; from app.main import app; assert prompts.MAIN_SYSTEM; assert app.title == 'ai-ch'"
      - name: Runtime smoke tests (admin, fallback chains, quota)
        env:
          DATA_DIR: /tmp/ai-ch-ci-data
          UPLOAD_DIR: /tmp/ai-ch-ci-uploads
          ADMIN_EMAIL: ci-admin@ai-ch.local
          ADMIN_PASSWORD: CIOnlyStrongPass1
          SESSION_SECRET: ci-only-secret
          PYTHONPATH: .
        run: python tests/runtime_smoke.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check frontend JavaScript syntax
        run: node --check frontend/js/app.js
      - name: Verify Render configuration
        run: python -c "import pathlib; d=pathlib.Path('Dockerfile').read_text(); r=pathlib.Path('render.yaml').read_text(); assert 'PORT:-8000' in d; assert 'QWEN_API_KEY' in r; assert '/api/health' in r"
