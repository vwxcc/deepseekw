services:
  - type: web
    name: ai-ch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_PROTECTION
        value: "1"
      - key: DATA_DIR
        value: /tmp/data
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: GLOBAL_AI_CONCURRENCY
        value: "1"
      - key: REQUEST_TIMEOUT
        value: "180"
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: SEARXNG_URL
        value: ""
      - key: WEB_SEARCH_TIMEOUT
        value: "6"
      - key: ADMIN_EMAIL
        value: admin@ai-ch.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://llm.stage.satel.org/v1
      - key: QWEN_MODEL
        value: qwen36-35b
      - key: QWEN_TEMPERATURE
        value: "0.2"
      - key: QWEN_MAX_TOKENS
        value: "12000"
